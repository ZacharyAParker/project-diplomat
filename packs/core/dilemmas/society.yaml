- id: school-phones
  title: Eyes Down
  description: >-
    A survey finds the average fourteen-year-old in {nation} checks a phone ninety times during the
    school day. Teachers suspect the figure is low, because the survey was conducted by phone.
  tags: [education, technology]
  when: { policy: phone_ban_schools, is: false }
  options:
    - id: ban
      advocate: { name: Agnes Whitlow, role: head teacher }
      speech: "Lock them in a box at the gate. I am tired of teaching the tops of heads."
      tags: [paternalist]
      effects:
        - { policy: phone_ban_schools, to: true }
        - { indicator: education, by: 3, why: "Lessons are being listened to, in some cases for the first time." }
        - { indicator: liberty, by: -1, why: "A national rule now governs what is in a child's pocket." }
        - { faction: youth, by: -5, why: "The young regard it as an act of war." }
        - { faction: grey, by: 4, why: "Grandparents approve of anything that takes a phone away." }
      headline: Phones banned in schools
      result: A thriving black market in decoy phones emerges within the week.

    - id: schools-decide
      advocate: { name: "{minister:education}", role: speaking in cabinet }
      speech: "Head teachers know their schools. Give them the power and let them use it or not."
      tags: [permissive]
      effects:
        - { indicator: education, by: 1, why: "Some schools ban phones and see results." }
        - { indicator: inequality, by: 2, why: "The schools that ban them are mostly the ones already doing well." }
        - { faction: mandarins, by: 3, why: "The civil service prefers guidance to law." }
        - { minister: education, by: 6, why: "The Education Minister's line carried." }
      headline: Phone rules left to head teachers
      result: Parents begin choosing schools by phone policy, then complaining about the one they chose.

    - id: teach-with
      advocate: { name: Tomas Reiker, role: head of policy at Scoot }
      speech: "The phone is the most powerful learning device ever made. Ban it and you are teaching children for a world that has gone."
      tags: [permissive]
      effects:
        - { indicator: fiscal, by: -1, why: "Schools get a grant for educational apps and the wifi to run them." }
        - { indicator: education, by: -3, why: "The apps are used for about a week." }
        - { faction: youth, by: 9, why: "The young cannot believe their luck." }
        - { faction: business, by: 5, why: "The technology firms have a new market." }
      headline: Phones to be used in lessons
      result: The first approved educational app is found to contain a slot machine.

- id: sugar-levy
  title: A Spoonful of Legislation
  description: >-
    The chief medical officer reports that a third of children in {nation} are overweight by the
    age of eleven, and proposes a levy on sweetened drinks. The drinks industry proposes a
    conversation about personal responsibility.
  tags: [health, tax]
  when: { policy: sugar_tax, is: false }
  options:
    - id: levy
      advocate: { name: Dr Imogen Sayer, role: chief medical officer }
      speech: "It worked on cigarettes. A can of Fizz has nine teaspoons of sugar and costs less than water."
      tags: [paternalist]
      effects:
        - { policy: sugar_tax, to: true }
        - { indicator: health, by: 4, why: "Manufacturers cut the sugar to stay under the levy." }
        - { indicator: fiscal, by: 3, why: "The levy brings in money from the drinks that did not change." }
        - { indicator: inequality, by: 2, why: "It takes the largest share from the smallest incomes." }
        - { faction: business, by: -7, why: "The drinks industry has many friends in the Chamber." }
      headline: Sugar levy introduced
      result: Fizz relaunches as Fizz Zero. It tastes of regret and sells extremely well.

    - id: labels
      advocate: { name: Barnaby Crewe, role: spokesman for the Soft Drinks Council }
      speech: "Consumers are adults. Put clearer labels on the can and trust them. It has the advantage of costing us nothing."
      tags: [permissive]
      effects:
        - { indicator: liberty, by: 2, why: "Nobody is told what to drink." }
        - { faction: business, by: 5, why: "The industry got the option it wrote." }
        - { indicator: health, by: -2, why: "The labels are accurate and nobody reads them." }
        - { minister: health, by: -8, why: "The Health Minister backed the levy in public." }
      headline: Clearer labels instead of a sugar levy
      result: The new label is a traffic light. It is red on everything, so people stop seeing it.

    - id: school-meals
      advocate: { name: Agnes Whitlow, role: head teacher }
      speech: "Tax the can if you like. But the one meal you control is the one I serve at noon. Fund that properly."
      tags: [spending]
      effects:
        - { indicator: fiscal, by: -2, why: "Free school lunches for every primary pupil cost real money." }
        - { indicator: health, by: 3, why: "Every child gets one proper meal a day." }
        - { indicator: education, by: 2, why: "Fed children concentrate in the afternoon." }
        - { faction: rural, by: 5, why: "The contracts specify local produce." }
      headline: Free school lunches for all primary pupils
      result: A generation learns to distrust any vegetable described as seasonal.

- id: tuition
  title: Degrees of Debt
  description: >-
    Graduates in {nation} leave university owing an average of four years' rent. Applications from
    the poorest districts have fallen for the third year. The universities would like more money,
    and do not mind where it comes from.
  tags: [education]
  when: { policy: tuition_fees, is: true }
  options:
    - id: abolish
      advocate: { name: Kasia Dunmore, role: president of the students' union }
      speech: "My parents went for free and then voted to charge me. Abolish the fees."
      tags: [spending, redistribution]
      effects:
        - { policy: tuition_fees, to: false }
        - { indicator: fiscal, by: -4, why: "The Treasury now pays what students used to borrow." }
        - { indicator: education, by: 3, why: "Applications from poorer districts recover." }
        - { faction: youth, by: 13, why: "The single thing the young most wanted." }
        - { faction: grey, by: -3, why: "Pensioners suspect they are paying for it." }
      headline: Tuition fees abolished
      result: Students celebrate by taking out exactly the same loans, for rent.

    - id: raise-cap
      advocate: { name: Professor Lucan Abernethy, role: vice-chancellor }
      speech: "World-class universities cost world-class money. Lift the cap and let us charge what the education is worth."
      tags: [austerity]
      effects:
        - { indicator: fiscal, by: 5, why: "Universities need less from the Treasury." }
        - { indicator: capacity, by: 2, why: "Research budgets grow with the fee income." }
        - { indicator: inequality, by: 3, why: "The most expensive courses are now the ones that lead to the best-paid work." }
        - { faction: youth, by: -11, why: "The young were hoping for the opposite." }
      headline: Cap on tuition fees lifted
      result: The vice-chancellor's salary rises in line with his university's ambition.

    - id: graduate-tax
      advocate: { name: Maren Okafor, role: economist at the Fair Share Institute }
      speech: "Replace the debt with a small tax on graduate earnings. The banker pays more than the nurse. Nobody gets a statement that makes them cry."
      tags: [redistribution]
      effects:
        - { policy: tuition_fees, to: false }
        - { indicator: inequality, by: -2, why: "High-earning graduates pay more than low-earning ones." }
        - { indicator: fiscal, by: -1, why: "The tax takes years to bring in what fees did." }
        - { indicator: administration, by: -4, why: "The tax office has to track every graduate for thirty years." }
        - { faction: youth, by: 7, why: "No debt, though the young read the small print." }
      headline: Fees replaced with a graduate tax
      result: Several thousand graduates discover a sudden wish to work abroad.

- id: faith-schools
  title: Render Unto the Education Budget
  description: >-
    One school in five in {nation} is run by a religious body and paid for by the state. An
    inspection has found that a handful teach the age of the Earth as a matter of opinion.
  tags: [education, religion]
  when: { policy: faith_schools_funded, is: true }
  options:
    - id: defund
      advocate: { name: Rufus Hale, role: civil liberties barrister }
      speech: "Believe what you like. Teach what you like. Just not with my taxes."
      tags: []
      effects:
        - { policy: faith_schools_funded, to: false }
        - { indicator: education, by: 2, why: "Every state-funded school now teaches the same curriculum." }
        - { indicator: administration, by: -5, why: "The state has to take over or replace a fifth of all schools." }
        - { faction: faithful, by: -11, why: "The Congregations see it as an attack on their existence." }
        - { faction: youth, by: 3, why: "The young are the least religious generation on record." }
      headline: State funding withdrawn from faith schools
      result: Church halls fill with meetings. The hymns are noticeably angrier.

    - id: inspect
      advocate: { name: "{minister:education}", role: speaking in cabinet }
      speech: "Keep the funding. Tie it to the national curriculum, and inspect. The good schools have nothing to fear."
      tags: []
      effects:
        - { indicator: education, by: 3, why: "The handful of failing schools are made to teach the curriculum." }
        - { indicator: administration, by: -2, why: "More inspectors, more inspections." }
        - { faction: faithful, by: -5, why: "The Congregations resent being inspected on doctrine." }
        - { minister: education, by: 5, why: "A compromise with the Education Minister's name on it." }
      headline: Faith schools keep funding but face inspection
      result: One school amends its science syllabus to say the Earth is "at least" six thousand years old.

    - id: leave
      advocate: { name: Bishop Ottoline Faye, role: chair of the Council of Congregations }
      speech: "We educated this nation's children for four centuries before there was a ministry. A little humility would suit you."
      tags: []
      effects:
        - { faction: faithful, by: 13, why: "The Congregations were shown respect." }
        - { indicator: education, by: -2, why: "The failing schools carry on as before." }
        - { indicator: legitimacy, by: -1, why: "The inspection report was commissioned, published and ignored." }
      headline: No change for faith schools
      result: The inspectors' report is filed under miscellaneous revelation.

- id: broadcaster-licence
  title: This Programme Is Brought to You by You
  description: >-
    The national broadcaster's licence fee is up for renewal. It costs every household the price of
    a sandwich a week, and every household has a view on whether the sandwich is any good.
  tags: [media]
  when: { policy: public_broadcaster, is: true }
  options:
    - id: renew
      advocate: { name: Dame Rosalind Achebe, role: director-general of the broadcaster }
      speech: "We are the only newsroom in the country that nobody owns. That is worth a sandwich."
      tags: []
      effects:
        - { indicator: legitimacy, by: 4, why: "A broadcaster the government does not control still reports on it." }
        - { indicator: education, by: 1, why: "Its schools programming is used in most classrooms." }
        - { faction: grey, by: 4, why: "Pensioners watch it more than anyone." }
        - { faction: business, by: -6, why: "Commercial rivals wanted its audience." }
        - { faction: youth, by: -2, why: "The young pay the fee and watch something else." }
      headline: Licence fee renewed
      result: The broadcaster marks the occasion with a four-part drama about a broadcaster under threat.

    - id: subscription
      advocate: { name: Idris Monk, role: fellow of the Free Enterprise Forum }
      speech: "If it is as loved as it says, people will pay for it voluntarily. If not, we have learned something."
      tags: [austerity]
      effects:
        - { policy: public_broadcaster, to: false }
        - { indicator: living, by: 1, why: "Households keep the price of the licence." }
        - { faction: business, by: 5, why: "Commercial broadcasters inherit the audience." }
        - { faction: grey, by: -11, why: "Pensioners lose the channels they watch, or pay more for them." }
        - { indicator: education, by: -2, why: "The schools programming did not survive the business plan." }
      headline: Licence fee scrapped; broadcaster goes subscription
      result: The nine o'clock news now opens with a word from its sponsor.

    - id: state-grant
      advocate: { name: "{minister:finance}", role: speaking in cabinet }
      speech: "Abolish the fee and fund it from general taxation. Fairer for the poor. And we would naturally respect its independence."
      tags: [spending]
      effects:
        - { indicator: fiscal, by: -2, why: "The broadcaster is now a line in the budget." }
        - { indicator: inequality, by: -1, why: "A flat fee was replaced by progressive tax." }
        - { indicator: liberty, by: -2, why: "The newsroom's budget is now set each year by the people it reports on." }
        - { faction: mandarins, by: 4, why: "The civil service gained a lever." }
      headline: Broadcaster to be funded directly by government
      result: Coverage of the Treasury becomes noticeably more respectful around budget time.

- id: pension-age
  title: Seventy Is the New Sixty-Five
  description: >-
    {demonym} people are living six years longer than when the pension age was set. The actuaries
    have submitted a report. Its cover is black.
  tags: [pensions, economy]
  when: { policy: pension_age, is: 65 }
  options:
    - id: raise
      advocate: { name: Lorne Abbasi, role: Treasury official }
      speech: "Raise it to sixty-eight, in steps. Nobody likes it. The alternative is that the fund runs out, which they will like less."
      tags: [austerity]
      effects:
        - { policy: pension_age, to: 68 }
        - { flag: pension_age_raised }
        - { indicator: fiscal, by: 8, why: "Three fewer years of pension for everyone who has not yet retired." }
        - { indicator: capacity, by: 2, why: "Older workers stay in their jobs." }
        - { faction: grey, by: -8, why: "Current pensioners are unaffected and angry anyway." }
        - { faction: labour, by: -13, why: "Three more years on the tools, for people whose knees are already gone." }
      headline: Pension age to rise to 68
      result: A man of sixty-four is interviewed on every channel. He is not pleased.

    - id: hold
      advocate: { name: Mabel Thwaite, role: secretary of the Pensioners' Convention }
      speech: "We paid in for forty years on a promise. Find the money somewhere else."
      tags: [spending]
      effects:
        - { indicator: fiscal, by: -3, why: "The pension bill grows every year people keep living." }
        - { faction: grey, by: 11, why: "Sixty-five stays sixty-five, as printed in the pension book." }
        - { faction: labour, by: 6, why: "The unions fought for sixty-five in the first place." }
        - { faction: youth, by: -4, why: "The young are paying for a pension they do not expect to get." }
      promise:
        id: pension-age-held
        text: The pension age stays at 65
        due: 60
        kept: { policy: pension_age, is: 65 }
        broken:
          - { indicator: legitimacy, by: -6, why: "The government promised sixty-five and then moved it." }
          - { faction: grey, by: -8, why: "Pensioners do not forget." }
      headline: Government pledges pension age will stay at 65
      result: The actuaries' report is returned with thanks.

    - id: means-test
      advocate: { name: Maren Okafor, role: economist at the Fair Share Institute }
      speech: "Keep sixty-five. Stop paying the state pension to people with a yacht."
      tags: [redistribution]
      effects:
        - { indicator: fiscal, by: 5, why: "The wealthiest tenth of pensioners no longer draw a state pension." }
        - { indicator: inequality, by: -2, why: "The saving comes entirely from the top." }
        - { indicator: administration, by: -4, why: "Every pension claim now needs an assessment of means." }
        - { faction: grey, by: -5, why: "Even pensioners who keep it dislike being assessed." }
      headline: State pension to be means-tested
      result: Sales of small, modest-looking yachts are reported to be strong.

- id: pension-march
  title: Grey Friday
  description: >-
    Two hundred thousand people have marched through {capital} against the new pension age. The
    organisers describe it as peaceful. It was also slow, and has not technically finished.
  tags: [pensions, order]
  when: { flag: pension_age_raised, days: 5 }
  priority: 1
  options:
    - id: hold-firm
      advocate: { name: "{minister:finance}", role: speaking in cabinet }
      speech: "We knew this would be unpopular. If we fold now, we fold on everything."
      tags: []
      effects:
        - { indicator: legitimacy, by: -2, why: "The largest march in a decade was ignored." }
        - { faction: grey, by: -7, why: "Two hundred thousand pensioners crossed the capital on foot and were not asked in." }
        - { faction: business, by: 4, why: "The Chamber admires a government that does not blink." }
        - { minister: finance, by: 6, why: "The Finance Minister's reform survived." }
      headline: Government refuses to back down on pension age
      result: The march disperses, promising to return. Marchers of that age mean it.

    - id: soften
      advocate: { name: Petra Hallam, role: general secretary of the rail union }
      speech: "Exempt the manual trades. A roofer of sixty-seven is not a policy, it is an accident waiting."
      tags: [pro_labour]
      effects:
        - { indicator: fiscal, by: -2, why: "The exemption gives back part of the saving." }
        - { indicator: administration, by: -2, why: "Someone has to decide which jobs count as manual." }
        - { faction: labour, by: 8, why: "The unions won something concrete." }
        - { faction: grey, by: 3, why: "Pensioners count any retreat as a start." }
      headline: Manual workers exempted from higher pension age
      result: The list of manual trades grows daily. It now includes, after lobbying, "senior management".

    - id: reverse
      advocate: { name: Mabel Thwaite, role: secretary of the Pensioners' Convention }
      speech: "You have seen the street. Put it back to sixty-five and we will all go home."
      tags: [spending]
      effects:
        - { policy: pension_age, to: 65 }
        - { indicator: fiscal, by: -4, why: "The whole saving is given back." }
        - { indicator: legitimacy, by: -2, why: "The government announced a reform and abandoned it within weeks." }
        - { faction: grey, by: 11, why: "The Grey Vote has learned that marching works." }
        - { minister: finance, by: -15, why: "The Finance Minister was overruled in public." }
      headline: Pension age U-turn
      result: The actuaries resubmit their report. The cover is still black.
